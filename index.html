        try {
            localStorage.setItem("le__" + key, value);
            return { key, value };
        }
        catch (e) {
            return null;
        }
    },
    get: (key) => {
        try {
            const v = localStorage.getItem("le__" + key);
            return v != null ? { key, value: v } : null;
        }
        catch (e) {
            return null;
        }
    },
    delete: (key) => {
        try {
            localStorage.removeItem("le__" + key);
            return { key, deleted: true };
        }
        catch (e) {
            return null;
        }
    },
    list: (prefix) => {
        try {
            const keys = [];
            const p = "le__" + (prefix || "");
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith(p))
                    keys.push(k.replace("le__", ""));
            }
            return { keys };
        }
        catch (e) {
            return { keys: [] };
        }

function parseWindow(w) {
    try {
        const clean = (w || "").replace(/[–—]/g, "-");
        const parts = clean.split("-").map(s => s.trim());
        if (parts.length < 2)
            return null;
        const parseMonthYear = (s) => {
            const t = s.trim().split(/\s+/);
            if (t.length < 2)
                return null;
            const m = t[0].substring(0, 3), y = parseInt(t[t.length - 1]);
            if (!MONTH_MAP.hasOwnProperty(m) || isNaN(y))
                return null;
            return new Date(y, MONTH_MAP[m], 1);
        };
        const years = clean.match(/\d{4}/g) || [];
        const yr = years[years.length - 1] || "2026", yr0 = years[0] || yr;
        const start = parseMonthYear(parts[0].match(/\d{4}/) ? parts[0] : parts[0] + " " + yr0);

    }

        return null;
